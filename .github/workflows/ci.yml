name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma adapter's gitignored test client is generated by Vitest's globalSetup
      # (vitest.globalsetup.ts) before tests run; lint/typecheck/build don't need it.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Every `*.db.spec.ts` suite (`pnpm test:db`) against real backends, in two shards so neither
  # waits on the other. Service containers back the specs that take a URL (`DURABLE_TEST_*`): they
  # isolate themselves on a shared server (a database, key prefix or queue prefix of their own). The
  # StateStore contract specs truncate the durable tables between cases, so they keep booting their
  # own testcontainers (the runner has Docker). `DURABLE_TEST_REQUIRE_BACKENDS` turns a case that
  # would skip itself for a missing backend into a failure, so a container that never started can't
  # pass as a green run.
  real-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: stores
            packages: packages/store-mikro-orm packages/store-typeorm packages/store-prisma packages/store-drizzle
          - shard: transports
            packages: packages/transport-bullmq packages/transport-db packages/transport-sqs packages/admission-redis packages/nestjs
    name: real backends (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
          POSTGRES_DB: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: durable
          MYSQL_DATABASE: durable
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdurable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.7
        ports:
          - 9324:9324
    env:
      DURABLE_TEST_REQUIRE_BACKENDS: "1"
      DURABLE_TEST_PG_URL: postgres://durable:durable@localhost:5432/durable
      DURABLE_TEST_MYSQL_URL: mysql://root:durable@127.0.0.1:3306/durable
      DURABLE_TEST_REDIS_URL: redis://localhost:6379
      DURABLE_TEST_SQS_ENDPOINT: http://localhost:9324
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ElasticMQ image ships no shell tool a health-cmd could use, so wait for it from here.
      - name: Wait for ElasticMQ
        run: timeout 60 bash -c 'until curl -sf "http://localhost:9324/?Action=ListQueues" >/dev/null; do sleep 1; done'
      - run: pnpm test:db ${{ matrix.packages }}

  # clients/python (durable-worker) ships separately to PyPI via the durable-worker-v* tag, and
  # until now nothing ran its tests — the `build` job above is entirely the pnpm workspace. A
  # library whose whole job is surviving a broken Redis should not rely on someone remembering
  # to run pytest locally.
  python-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version release-python.yml builds the wheel on, and the version the first
        # consumer (FLIP's flip-flask image) actually runs. `requires-python` says >=3.9, but
        # the [redis] extra cannot resolve there: bullmq is capped <2.18 for the patched-msgpack
        # reason in pyproject.toml, and no such bullmq supports 3.9. Testing a floor that cannot
        # install the transport would just be a red job.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      # Every extra, not just [redis]: without them ~30 tests fail on missing boto3/asyncpg/
      # aiomysql, which reads as a broken suite rather than an incomplete install.
      - name: Install the client with all extras
        working-directory: clients/python
        run: pip install -e ".[redis,sqs,postgres,mysql]" pytest
      - name: Run tests
        working-directory: clients/python
        run: pytest tests/ -q
