name: Release

# Publishing lives in THIS FILE ONLY, and that is a constraint rather than a preference:
# npm trusted publishing binds each package to exactly one (repository, workflow file) pair,
# so a second workflow that ran `npm publish` could not authenticate. The beta snapshot used
# to be `release-snapshot.yml`; it is the `workflow_dispatch` path below now.
#
#   push to main        -> version the pending changesets in place (a "chore: version packages"
#                          commit pushed to main) and publish them, in the same run
#   run manually        -> throwaway beta snapshot, changesets and git untouched
#
# No "Version Packages" PR to merge: merging a PR that carries a changeset IS the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases concurrently (avoids a double-publish race). Shared by both paths
# on purpose: a snapshot racing a real publish is the same hazard.
concurrency: release-${{ github.ref }}

jobs:
  # Gate: ci.yml's npm-side jobs (build, real-backends), run on the exact commit being released --
  # a published version is effectively unrecallable, so the PR's CI on an older base is not
  # enough. ci.yml's python-client job is left out on purpose: clients/python ships to PyPI via
  # release-python.yml, not from here. The version/publish job below needs these jobs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma adapter's gitignored test client is generated by Vitest's globalSetup
      # (vitest.globalsetup.ts) before tests run; lint/typecheck/build don't need it.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Every `*.db.spec.ts` suite (`pnpm test:db`) against real backends, in two shards so neither
  # waits on the other. Service containers back the specs that take a URL (`DURABLE_TEST_*`): they
  # isolate themselves on a shared server (a database, key prefix or queue prefix of their own). The
  # StateStore contract specs truncate the durable tables between cases, so they keep booting their
  # own testcontainers (the runner has Docker). `DURABLE_TEST_REQUIRE_BACKENDS` turns a case that
  # would skip itself for a missing backend into a failure, so a container that never started can't
  # pass as a green run.
  real-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: stores
            packages: packages/store-mikro-orm packages/store-typeorm packages/store-prisma packages/store-drizzle
          - shard: transports
            packages: packages/transport-bullmq packages/transport-db packages/transport-sqs packages/admission-redis packages/nestjs
    name: real backends (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
          POSTGRES_DB: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: durable
          MYSQL_DATABASE: durable
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdurable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.7
        ports:
          - 9324:9324
    env:
      DURABLE_TEST_REQUIRE_BACKENDS: "1"
      DURABLE_TEST_PG_URL: postgres://durable:durable@localhost:5432/durable
      DURABLE_TEST_MYSQL_URL: mysql://root:durable@127.0.0.1:3306/durable
      DURABLE_TEST_REDIS_URL: redis://localhost:6379
      DURABLE_TEST_SQS_ENDPOINT: http://localhost:9324
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ElasticMQ image ships no shell tool a health-cmd could use, so wait for it from here.
      - name: Wait for ElasticMQ
        run: timeout 60 bash -c 'until curl -sf "http://localhost:9324/?Action=ListQueues" >/dev/null; do sleep 1; done'
      - run: pnpm test:db ${{ matrix.packages }}

  release:
    name: Version PR or Publish
    if: github.event_name == 'push'
    needs: [build, real-backends]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "chore: version packages" commit + git tags
      id-token: write # mints the OIDC credential npm exchanges for a publish token
      pull-requests: read # @changesets/changelog-github resolves each changeset's PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          # pnpm 11.5 (the pinned packageManager) needs Node >= 22.13; .nvmrc pins it.
          # Trusted publishing needs >= 22.14.0, which that satisfies.
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm only learned OIDC in 11.5.1, and .nvmrc pins Node 22, which ships 10.9.x. Without
      # this the publish fails as `E404 - PUT https://registry.npmjs.org/<pkg>`: npm answers 404
      # rather than 403 for an unauthorized package, so it reads as "no such package" rather
      # than "not authenticated". Upgraded here rather than by moving .nvmrc, so the toolchain
      # the packages are built and tested against does not change.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the new dependency would reach npm only with the next hand-written changeset. This writes
      # a patch changeset for it, which the version step below then releases like any other.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const changed = git("diff", "--name-only", before + ".." + after)
            .split("\n")
            .filter((f) => f === "package.json" || f.endsWith("/package.json"));
          if (changed.length === 0) skip("no package.json changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) => JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"

      # Pending changesets -> bump versions and changelogs and push them as a "chore: version
      # packages" commit to the branch (a GITHUB_TOKEN push starts no new run, so this cannot loop).
      #
      # Only what the gate tested is released. If the branch moved during this run, the only commits
      # tolerated on top of the tested one are this bot's own version commits (same code, only
      # versions and changelogs moved): fast-forward onto them so their changesets are not versioned
      # twice. Any other commit is untested here, so stop cleanly -- no version, no publish -- and let
      # the run queued for it (concurrency group) gate and release the combined tree.
      - name: Version packages
        id: version
        env:
          TESTED: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          # @changesets/changelog-github looks up each changeset's PR and author; throws without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          superseded() {
            echo "::notice::branch moved past the tested commit; the newer run will release"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          moved=$(git rev-list "$TESTED..origin/$BRANCH")
          for c in $moved; do
            [ "$(git log -1 --format='%an|%s' "$c")" = 'github-actions[bot]|chore: version packages' ] || superseded
          done
          git merge --ff-only "origin/$BRANCH"
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'readme.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets: publishing whatever is not on npm yet."
            exit 0
          fi
          pnpm version-packages
          git add -A
          if git diff --cached --quiet; then
            echo "version-packages changed nothing (e.g. only private packages): nothing to commit."
            exit 0
          fi
          git commit -m "chore: version packages"
          git push origin "HEAD:$BRANCH" && exit 0
          # Rejected: the branch moved after the check above. Fail loudly only if it did not move.
          git fetch origin "$BRANCH"
          [ "$(git rev-parse "origin/$BRANCH")" != "$(git rev-parse HEAD~1)" ] && superseded
          echo "::error::Pushing the version commit failed and the branch has not moved."
          exit 1

      # No changesets are left by now, so the action takes its publish path: `pnpm release` (build
      # all + `changeset publish`) publishes every package whose version is not on npm yet, then
      # tags git and creates the GitHub releases.
      - name: Publish to npm
        if: steps.version.outputs.superseded != 'true'
        uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately no NODE_AUTH_TOKEN. `setup-node` writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc, so wiring an
          # unset secret leaves an EMPTY credential there, which npm sends instead of falling
          # through to the OIDC exchange. Absent is not the same as empty.
          NPM_CONFIG_PROVENANCE: true

  snapshot:
    name: Publish beta snapshot to npm
    if: github.event_name == 'workflow_dispatch'
    needs: [build, real-backends]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC credential npm exchanges for a publish token
      pull-requests: read # @changesets/changelog-github, as in the release job
    steps:
      # Cuts a THROWAWAY prerelease of every package with a pending changeset, published under the
      # `beta` dist-tag as `0.0.0-beta-<timestamp>`. It does NOT consume the changesets, bump source
      # versions, or tag git — so the eventual real release (the next push to main) is untouched
      # and still produces clean semver. Use it to test unreleased work before the final release:
      #   pnpm add @dudousxd/nestjs-durable-core@beta
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp every pending-changeset package (and any out-of-range dependent) to `0.0.0-beta-<datetime>`
      # in the runner only — never committed.
      - name: Version as beta snapshot
        run: pnpm changeset version --snapshot beta

      - name: Build all packages
        run: pnpm build

      # `@latest` is untouched: these land under the `beta` dist-tag with no git tag.
      - name: Publish beta snapshot
        run: pnpm changeset publish --tag beta --no-git-tag
        env:
          # No NODE_AUTH_TOKEN here either — see the note in the release job.
          NPM_CONFIG_PROVENANCE: true
