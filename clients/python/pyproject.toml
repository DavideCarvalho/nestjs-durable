[project]
name = "durable-worker"
version = "0.28.0"
description = "Python worker SDK for nestjs-durable — run durable workflow steps in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Davide Carvalho", email = "davi@goflip.ai" }]
keywords = ["workflow", "durable", "nestjs", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/DavideCarvalho/nestjs-durable"
Repository = "https://github.com/DavideCarvalho/nestjs-durable"
Issues = "https://github.com/DavideCarvalho/nestjs-durable/issues"

[project.optional-dependencies]
# bullmq pins its own msgpack and redis exactly. 3.6.2 pins msgpack==1.2.4, which has the fixes for
# GHSA-6v7p-g79w-8964 and CVE-2026-114613, so consumers no longer need a msgpack override. The
# msgpack pin here matches bullmq's; move both together.
redis = ["bullmq==3.6.2", "msgpack==1.2.4"]
sqs = ["boto3==1.44.5"]
postgres = ["asyncpg==0.32.0"]
mysql = ["aiomysql==0.3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["durable_worker"]
