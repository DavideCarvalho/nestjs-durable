packages:
  - "packages/*"
  - "examples/*"
  - "website"
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
minimumReleaseAgeExclude:
  # First-party packages: the minimum-release-age policy guards against recently-published
  # THIRD-party (potentially compromised) deps — our own scope is exempt. Patterns match
  # package NAMES (globs), not name@version.
  - '@dudousxd/*'
  - '@nestjs/authorization@0.1.3'
  - '@nestjs/idempotency@0.0.4'
  - '@nestjs/locks@0.0.6'
  - '@nestjs/outbox@0.1.4'
  - '@nestjs/workflows@0.0.5'
overrides:
  # @dudousxd/nestjs-telescope 3.x pins better-sqlite3 11.10.0, which neither ships a prebuild for
  # nor compiles on Node 26. Drop this once the devDependency is on a telescope release with 12.x.
  '@dudousxd/nestjs-telescope>better-sqlite3': 12.11.1
